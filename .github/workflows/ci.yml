name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build image
        run: |
          IMAGE="ex2-dataops"
          SHA="${GITHUB_SHA::7}"
          # A tag por SHA é a identidade primária e única de cada build.
          # Ela nunca é sobrescrita: cada commit produz uma imagem rastreável
          # de forma independente.
          docker build -t "${IMAGE}:${SHA}" .

      - name: Show image identity
        run: |
          echo "Primary tag: ex2-dataops:${GITHUB_SHA::7}"
          docker image inspect "ex2-dataops:${GITHUB_SHA::7}" --format '{{.Id}} {{index .RepoTags 0}}'

      # Promoção de versão (v1, v2, ...) é uma decisão manual, não automática.
      # O CI prova que o commit builda e roda; ele não decide sozinho que um
      # commit vira a versão "v1" estável. Promover uma tag de versão para o
      # SHA validado aqui é um passo separado e deliberado:
      #   docker tag ex2-dataops:<sha> ex2-dataops:v1
      # Se o build aqui também sobrescrevesse "v1" a cada push, a v1 "boa"
      # nunca ficaria estável o suficiente para servir de alvo de rollback.

      # Publicação em GHCR/Docker Hub é opcional e exige credenciais do repositório.
      # Não é necessária para o workflow passar.
      # Exemplo (não habilitado):
      #   echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      #   docker tag ex2-dataops:${GITHUB_SHA::7} ghcr.io/${{ github.repository_owner }}/ex2-dataops:${GITHUB_SHA::7}
      #   docker push ghcr.io/${{ github.repository_owner }}/ex2-dataops:${GITHUB_SHA::7}
